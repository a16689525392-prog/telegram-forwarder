services:
  telegram-forwarder:
    build: .
    container_name: telegram-forwarder
    restart: unless-stopped
    volumes:
      - ./session:/app/session
    # API_ID / API_HASH / BOT_TOKEN 等密钥放在 .env 中（从 .env.example 复制），不要提交到仓库
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
